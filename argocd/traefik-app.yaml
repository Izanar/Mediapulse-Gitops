apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # Устанавливаем в первую очередь
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: traefik
    repoURL: https://traefik.github.io/charts
    targetRevision: 42.0.0
    helm:
      values: |
        # Traefik как Deployment (не DaemonSet), без hostPort.
        # Внешний трафик идёт через LoadBalancer (MetalLB).
        deployment:
          enabled: true
          kind: Deployment
          replicas: 3
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/instance: traefik
                    topologyKey: kubernetes.io/hostname

        # Сервис типа LoadBalancer — забор трафика забирает MetalLB (локальный LB)
        service:
          enabled: true
          annotations:
            metallb.universe.tf/address-pool: traefik-pool
          spec:
            type: LoadBalancer

        ports:
          web:
            port: 8000
            expose:
              default: true
            exposedPort: 80
          websecure:
            port: 8443
            expose:
              default: true
            exposedPort: 443

        # Настройки безопасности и логирования
        providers:
          kubernetesCRD:
            enabled: true     # Обязательно: включает поддержку IngressRoute
          kubernetesIngress:
            enabled: true     # Поддержка стандартных Ingress ресурсов

        # Метрики (полезно для мониторинга)
        metrics:
          prometheus:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true