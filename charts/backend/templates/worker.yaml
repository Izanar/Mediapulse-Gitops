apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediapulse-worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: mediapulse-worker
  template:
    metadata:
      labels:
        app: mediapulse-worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.worker.image }}:{{ .Values.worker.tag }}"
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: mediapulse-backend-secrets