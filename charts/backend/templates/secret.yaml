apiVersion: v1
kind: Secret
metadata:
  name: mediapulse-backend-secrets
  namespace: default
type: Opaque
stringData:
  POSTGRES_SERVER: {{ .Values.database.host | quote }}
  POSTGRES_PORT: {{ .Values.database.port | quote }}
  POSTGRES_USER: {{ .Values.database.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.database.password | quote }}
  POSTGRES_DB: {{ .Values.database.db | quote }}
  REDIS_HOST: {{ .Values.redis.host | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}
  SECRET_KEY: {{ .Values.secretKey | default "super-secret-key" | quote }}
  S3_ENDPOINT_URL: {{ .Values.storage.endpoint | quote }}
  S3_ACCESS_KEY: {{ .Values.storage.accessKeyId | quote }}
  S3_SECRET_KEY: {{ .Values.storage.secretAccessKey | quote }}
  S3_BUCKET_NAME: {{ .Values.storage.bucketName | quote }}