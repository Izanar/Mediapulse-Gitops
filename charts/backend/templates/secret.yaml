apiVersion: v1
kind: Secret
metadata:
  name: mediapulse-backend-secrets
  namespace: default
type: Opaque
stringData:
  DATABASE_URL: "postgresql://{{ .Values.database.user }}:{{ .Values.database.password }}@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.db }}"
  REDIS_URL: "redis://{{ .Values.redis.host }}:{{ .Values.redis.port }}/0"
  AWS_ACCESS_KEY_ID: {{ .Values.storage.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.storage.secretAccessKey | quote }}
  AWS_ENDPOINT_URL_S3: {{ .Values.storage.endpoint | quote }}
  BUCKET_NAME: {{ .Values.storage.bucketName | quote }}