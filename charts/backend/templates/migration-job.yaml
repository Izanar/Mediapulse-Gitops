apiVersion: batch/v1
kind: Job
metadata:
  name: mediapulse-migration
  namespace: "{{ .Release.Namespace }}"
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-migration
          image: "{{ .Values.api.image }}:{{ .Values.api.tag }}"
          # Команда, которая запускает миграции в твоем проекте (замени на свою, если она отличается)
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: mediapulse-backend-secrets