apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediapulse-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: mediapulse-api
  template:
    metadata:
      labels:
        app: mediapulse-api
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: api
          image: "{{ .Values.api.image }}:{{ .Values.api.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.api.port }}
          envFrom:
            - secretRef:
                name: mediapulse-backend-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: mediapulse-api-svc
spec:
  ports:
    - port: 80
      targetPort: {{ .Values.api.port }}
  selector:
    app: mediapulse-api