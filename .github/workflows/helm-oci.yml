name: Publish Helm charts to GHCR (OCI)

on:
  push:
    branches: [main]
    paths:
      - 'local/charts/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  OCI_PATH: oci://ghcr.io/izanar/mediapulse-charts

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        run: |
          curl -fsSL -o /tmp/get-helm-3 https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 /tmp/get-helm-3
          /tmp/get-helm-3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push charts
        run: |
          set -euo pipefail
          mkdir -p /tmp/charts
          for chart in local/charts/*/; do
            name=$(basename "$chart")
            echo "==> helm package ${name}"
            helm package "$chart" --destination /tmp/charts
            echo "==> helm push ${name} -> ${{ env.OCI_PATH }}"
            helm push "/tmp/charts/${name}-"*.tgz "${{ env.OCI_PATH }}"
          done
