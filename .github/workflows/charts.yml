name: Charts / Lint, Bump version, Package

# Версионирует только чарты приложения в local/charts/*.
# Инфра-чарты (local/manifests/*) и чужие upstream-чарты здесь не трогаем.
# Версии образов приложения Gitops забирает сам из GHCR (опрос :latest),
# поэтому никакого PAT и notify-job в Mediapulse-App не нужно.
# Требование: пакетам ghcr.io/izanar/mediapulse-app/api и .../worker дать
# Actions-доступ для репозитория Mediapulse-Gitops (или сделать их public).
on:
  push:
    branches: [main]
    paths:
      - 'local/charts/**'
  schedule:
    # Опрос GHCR: подхватить новый образ приложения (sha-тег) без PAT.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: read

env:
  API_IMG: ghcr.io/izanar/mediapulse-app/api
  WORKER_IMG: ghcr.io/izanar/mediapulse-app/worker

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        run: |
          curl -fsSL -o /tmp/get-helm-3 https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 /tmp/get-helm-3
          /tmp/get-helm-3

      - name: Lint charts
        run: |
          set -euo pipefail
          # Чарты приложения (версионируются ниже).
          for chart in local/charts/*/; do
            echo "==> helm lint $(basename "$chart")"
            helm lint "$chart"
          done
          # Короткие инфра-чарты (только lint+render, версии не трогаем).
          for chart in local/manifests/traefik local/manifests/kubernetes-dashboard; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "==> helm lint $(basename "$chart") (manifests)"
              helm lint "$chart"
              echo "==> helm template $(basename "$chart") (manifests)"
              helm template test "$chart" > /dev/null
            fi
          done

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect new app image + bump chart versions
        id: bump
        run: |
          set -euo pipefail
          BUMPED=""
          IMAGE_TAG=""

          # 1. Какие чарты менялись этим пушем (для schedule — пусто).
          CHANGED=""
          if [ "${{ github.event_name }}" = "push" ]; then
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              CHANGED=$(git diff --name-only HEAD~1 HEAD -- local/charts/ || true)
              echo "Changed files:"; echo "$CHANGED"
            else
              CHANGED="local/charts/backend/ local/charts/databases/"
            fi
          fi

          bump_patch() {
            local chart_dir="$1"
            local chart_file="$chart_dir/Chart.yaml"
            local cur
            cur=$(grep -m1 '^version:' "$chart_file" | awk '{print $2}')
            local bumped
            bumped=$(python3 -c "v='$cur'.split('.'); print(f'{v[0]}.{v[1]}.{int(v[2])+1}')")
            sed -i "s/^version: .*/version: $bumped/" "$chart_file"
            echo "Bumped $(basename "$chart_dir"): $cur -> $bumped"
            BUMPED="$BUMPED $(basename "$chart_dir")"
          }

          # 2. Новый образ приложения из GHCR (метка :latest -> revision -> sha-тег).
          # GITHUB_TOKEN видит пакеты своей организации при packages:read;
          # для приватных пакетов дай репозиторию Mediapulse-Gitops доступ:
          # страница пакета -> Package settings -> Manage Actions access -> Add repository.
          CUR_TAG=$(grep -m1 '^  tag:' local/charts/backend/values.yaml | awk '{print $2}')
          echo "Текущий tag в чарте backend: ${CUR_TAG}"
          if docker pull "${API_IMG}:latest" >/dev/null 2>&1; then
            REV=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${API_IMG}:latest" || true)
            if [ -n "${REV:-}" ]; then
              NEW_TAG="sha-$(echo "$REV" | cut -c1-7)"
              echo "Образ ${API_IMG}:latest -> revision ${REV} -> ${NEW_TAG}"
              if [ "$NEW_TAG" != "$CUR_TAG" ]; then
                sed -i "s/^  tag: .*/  tag: $NEW_TAG/" local/charts/backend/values.yaml
                sed -i "s/^appVersion: .*/appVersion: \"$NEW_TAG\"/" local/charts/backend/Chart.yaml
                bump_patch local/charts/backend
                IMAGE_TAG="$NEW_TAG"
              else
                echo "Образ не изменился — tag чарта актуален."
              fi
            else
              echo "::warning::У образа ${API_IMG}:latest нет label org.opencontainers.image.revision — пропускаю сверку образа."
            fi
          else
            echo "::warning::Не смог pull ${API_IMG}:latest (нет доступа?). Чарты из git всё равно проверю; открой доступ к пакету для Mediapulse-Gitops."
          fi

          # 3. Чарты, изменённые пушем (backend повторно не бампаем, если уже поднят за образ).
          for chart in local/charts/*/; do
            name=$(basename "$chart")
            if echo "$CHANGED" | grep -q "local/charts/$name/"; then
              if [ "$name" = "backend" ] && echo "$BUMPED" | grep -q backend; then
                continue
              fi
              bump_patch "$chart"
            fi
          done

          echo "bumped=${BUMPED:-<none>}"
          echo "bumped=$BUMPED" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Render + package charts
        run: |
          set -euo pipefail
          mkdir -p /tmp/charts
          for chart in local/charts/*/; do
            name=$(basename "$chart")
            echo "==> helm template ${name}"
            helm template test "$chart" > /dev/null
            echo "==> helm package ${name}"
            helm package "$chart" --destination /tmp/charts
          done
          ls -la /tmp/charts

      - name: Commit version bump
        run: |
          set -euo pipefail
          if git diff --quiet -- local/charts/; then
            echo "Изменений версий нет — коммитить нечего."
            exit 0
          fi
          git add local/charts/
          if [ -n "${{ steps.bump.outputs.image_tag }}" ]; then
            git commit -m "chart: bump backend -> ${{ steps.bump.outputs.image_tag }} (app-image-pushed)"
          else
            git commit -m "chart: bump${{ steps.bump.outputs.bumped }} (charts changed)"
          fi
          git push
