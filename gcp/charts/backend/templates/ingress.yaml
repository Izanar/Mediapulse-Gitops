apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mediapulse-backend-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "mediapulse-global-ip"
spec:
  rules:
    - host: mediapulse.izanar.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mediapulse-api # Имя твоего Kubernetes Service для бэкенда
                port:
                  number: 80