apiVersion: batch/v1
kind: Job
metadata:
  name: mediapulse-migration
  namespace: "{{ .Release.Namespace }}"
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-creation
    argocd.argoproj.io/sync-wave: "1" # Опционально: синхронизация в нужной волне
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-migration
          image: "{{ .Values.api.image }}:{{ .Values.api.tag }}"
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: mediapulse-backend-secrets