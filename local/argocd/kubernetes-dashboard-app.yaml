apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubernetes-dashboard
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/Izanar/Mediapulse-Gitops.git'
    targetRevision: HEAD
    path: local/manifests/kubernetes-dashboard
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kubernetes-dashboard
  ignoreDifferences:
    - group: ''
      kind: ConfigMap
      name: kubernetes-dashboard-settings
      namespace: kubernetes-dashboard
      jsonPointers:
        - /data
    - group: ''
      kind: Secret
      name: kubernetes-dashboard-csrf
      namespace: kubernetes-dashboard
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true