apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://helm.releases.hashicorp.com'
    targetRevision: 0.27.0
    chart: vault
    helm:
      values: |
        server:
          dev:
            enabled: true
          ui:
            enabled: true
  destination:
    server: 'https://kubernetes.default.svc' 
    namespace: vault 
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
