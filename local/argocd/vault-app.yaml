apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://helm.releases.hashicorp.com'
    targetRevision: 0.27.0
    chart: vault
    helm:
      values: |
        server:
          dev:
            enabled: false
          dataStorage:
            enabled: true
            size: 1Gi
          ha:
            enabled: true
            replicas: 1
            raft:
              enabled: true
              setNodeId: true
          ui:
            enabled: true
  destination:
    server: 'https://kubernetes.default.svc' 
    namespace: vault 
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: vault-agent-injector-cfg
      jqPathExpressions:
        - '.webhooks[] | select(.name == "vault.hashicorp.com") | .clientConfig.caBundle'
        - '.webhooks[] | select(.name == "vault.hashicorp.com") | .clientConfig.service.port'
        - '.webhooks[] | select(.name == "vault.hashicorp.com") | .namespaceSelector'
        - '.webhooks[] | select(.name == "vault.hashicorp.com") | .reinvocationPolicy'
        - '.webhooks[] | select(.name == "vault.hashicorp.com") | .rules[] | .scope'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
