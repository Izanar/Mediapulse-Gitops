apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mediapulse-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Izanar/Mediapulse-Gitops.git'
    targetRevision: HEAD
    path: local/charts/secrets
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
