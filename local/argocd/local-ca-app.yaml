apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-ca
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: 'https://github.com/Izanar/Mediapulse-Gitops.git'
    targetRevision: HEAD
    path: local/manifests/local-ca
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: cert-manager
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true