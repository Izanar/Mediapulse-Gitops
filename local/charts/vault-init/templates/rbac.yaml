{{- if .Values.rbac.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-init
  namespace: "{{ .Release.Namespace }}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-init
  namespace: "{{ .Release.Namespace }}"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-init
  namespace: "{{ .Release.Namespace }}"
subjects:
  - kind: ServiceAccount
    name: vault-init
    namespace: "{{ .Release.Namespace }}"
roleRef:
  kind: Role
  name: vault-init
  apiGroup: rbac.authorization.k8s.io
{{- end -}}