apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mediapulse-app-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: mediapulse-backend-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_SERVER
      remoteRef:
        key: mediapulse
        property: postgres_server
    - secretKey: POSTGRES_PORT
      remoteRef:
        key: mediapulse
        property: postgres_port
    - secretKey: POSTGRES_USER
      remoteRef:
        key: mediapulse
        property: postgres_user
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: mediapulse
        property: postgres_password
    - secretKey: POSTGRES_DB
      remoteRef:
        key: mediapulse
        property: postgres_db
    - secretKey: REDIS_HOST
      remoteRef:
        key: mediapulse
        property: redis_host
    - secretKey: REDIS_PORT
      remoteRef:
        key: mediapulse
        property: redis_port
    - secretKey: SECRET_KEY
      remoteRef:
        key: mediapulse
        property: secret_key
    - secretKey: S3_ENDPOINT_URL
      remoteRef:
        key: mediapulse
        property: s3_endpoint_url
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: mediapulse
        property: s3_access_key
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: mediapulse
        property: s3_secret_key
    - secretKey: S3_BUCKET_NAME
      remoteRef:
        key: mediapulse
        property: s3_bucket_name
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-tunnel-token
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: cloudflare-tunnel-token
    creationPolicy: Owner
  data:
    - secretKey: tunnel-token
      remoteRef:
        key: mediapulse
        property: cloudflare_tunnel_token
