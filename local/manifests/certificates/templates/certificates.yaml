apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-local-tls
  namespace: argocd
spec:
  secretName: argocd-local-tls
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    name: mediapulse-local-ca
    kind: ClusterIssuer
  dnsNames:
    - argocd.local
  usages:
    - digital signature
    - key encipherment
    - server auth
---
