apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-izanar-dev-tls
  namespace: argocd
spec:
  secretName: argocd-izanar-dev-tls
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    name: mediapulse-local-ca
    kind: ClusterIssuer
  dnsNames:
    - argocd.izanar.dev
  usages:
    - digital signature
    - key encipherment
    - server auth
---
