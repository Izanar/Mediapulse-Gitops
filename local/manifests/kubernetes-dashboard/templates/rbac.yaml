apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.adminUser }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.adminUser }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ .Values.adminUser }}
    namespace: {{ .Release.Namespace }}
