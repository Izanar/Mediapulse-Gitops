apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: k8s-dashboard-ingress
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.host }}`)
      kind: Rule
      services:
        - name: kubernetes-dashboard
          port: {{ .Values.service.port }}
          scheme: https
          serversTransport: k8s-dashboard-transport
  tls:
    secretName: k8s-local-tls
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: k8s-dashboard-transport
  namespace: {{ .Release.Namespace }}
spec:
  serverName: kubernetes-dashboard.kubernetes-dashboard.svc
  rootCAsSecrets:
    - kubernetes-dashboard-internal-tls
