apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-dashboard
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      app: kubernetes-dashboard
  template:
    metadata:
      labels:
        app: kubernetes-dashboard
    spec:
      serviceAccountName: {{ .Values.adminUser }}
      containers:
        - name: kubernetes-dashboard
          image: "{{ .Values.dashboard.image }}"
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: serving-certificate
              mountPath: /tls
              readOnly: true
          args:
            - --namespace={{ .Release.Namespace }}
            - --default-cert-dir=/tls
            - --tls-cert-file=tls.crt
            - --tls-key-file=tls.key
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: serving-certificate
          secret:
            secretName: kubernetes-dashboard-internal-tls
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-dashboard
spec:
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  selector:
    app: kubernetes-dashboard
