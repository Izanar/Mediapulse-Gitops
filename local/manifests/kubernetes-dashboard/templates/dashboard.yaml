apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-dashboard
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      app: kubernetes-dashboard
  template:
    metadata:
      labels:
        app: kubernetes-dashboard
    spec:
      serviceAccountName: {{ .Values.adminUser }}
      containers:
        - name: kubernetes-dashboard
          image: "{{ .Values.dashboard.image }}"
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          args:
            - --namespace={{ .Release.Namespace }}
            - --default-cert-dir=/tmp
            - --auto-generate-certificates
      volumes:
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-dashboard
spec:
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  selector:
    app: kubernetes-dashboard
