dashboard:
  image: kubernetesui/dashboard:v2.7.0
  replicas: 1

service:
  port: 443
  targetPort: 8443

# Домен Kubernetes Dashboard через Cloudflare Tunnel — https://kind.izanar.dev/
host: kind.izanar.dev

# ServiceAccount для входа по токену (kubectl -n kubernetes-dashboard create token admin-user)
adminUser: admin-user
