apiVersion: batch/v1
kind: Job
metadata:
  name: local-ca-creator
  namespace: cert-manager
spec:
  template:
    spec:
      serviceAccountName: local-ca-creator
      restartPolicy: OnFailure
      containers:
      - name: ca-creator
        image: alpine:3.19
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            apk add --no-cache openssl curl
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl && cp kubectl /usr/local/bin/kubectl
            cp /scripts/generate-ca.sh /tmp/generate-ca.sh
            chmod +x /tmp/generate-ca.sh
            /tmp/generate-ca.sh
        volumeMounts:
        - name: script
          mountPath: /scripts
      volumes:
      - name: script
        configMap:
          name: local-ca-script