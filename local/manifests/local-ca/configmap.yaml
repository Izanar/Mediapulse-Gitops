apiVersion: v1
kind: ConfigMap
metadata:
  name: local-ca-script
  namespace: cert-manager
data:
  generate-ca.sh: |
    #!/bin/sh
    set -eu

    NAMESPACE="cert-manager"
    SECRET_NAME="mediapulse-local-ca"
    CA_DIR="/tmp/ca"
    CA_KEY="$CA_DIR/ca.key"
    CA_CERT="$CA_DIR/ca.crt"

    mkdir -p "$CA_DIR"

    # Если Secret уже есть — не трогаем (идемпотентность)
    if kubectl -n "$NAMESPACE" get secret "$SECRET_NAME" >/dev/null 2>&1; then
      echo "Secret $SECRET_NAME already exists. Skipping CA generation."
      exit 0
    fi

    # Генерируем корневой CA внутри пода
    openssl req -x509 -newkey rsa:3072 -sha256 -nodes -days 3650 \
      -keyout "$CA_KEY" \
      -out "$CA_CERT" \
      -subj "/CN=Mediapulse Local Development CA" \
      -addext "basicConstraints=critical,CA:TRUE,pathlen:0" \
      -addext "keyUsage=critical,keyCertSign,cRLSign"

    chmod 600 "$CA_KEY"
    chmod 644 "$CA_CERT"

    # Создаём Secret в cert-manager
    kubectl -n "$NAMESPACE" create secret tls "$SECRET_NAME" \
      --cert="$CA_CERT" \
      --key="$CA_KEY" \
      --dry-run=client \
      -o yaml | kubectl apply -f -

    echo "✅ Local CA secret created: $SECRET_NAME"