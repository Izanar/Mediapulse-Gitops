apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: traefik
                topologyKey: kubernetes.io/hostname
      containers:
        - name: traefik
          image: "{{ .Values.image }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          ports:
            - name: traefik
              containerPort: {{ .Values.ports.traefik }}
            - name: web
              containerPort: {{ .Values.ports.web }}
            - name: metrics
              containerPort: {{ .Values.ports.metrics }}
          args:
            - --entrypoints.traefik.address=:{{ .Values.ports.traefik }}/tcp
            - --entrypoints.web.address=:{{ .Values.ports.web }}/tcp
            - --entrypoints.metrics.address=:{{ .Values.ports.metrics }}/tcp
            - --providers.kubernetescrd
            - --providers.kubernetesingress
            - --api.dashboard=true
            - --ping=true
            - --metrics.prometheus=true
            - --metrics.prometheus.entrypoint=metrics
            - --metrics.prometheus.addentrypointslabels=true
            - --metrics.prometheus.addserviceslabels=true
            - --log.level=INFO
            - --global.checknewversion=false
          readinessProbe:
            httpGet:
              path: /ping
              port: traefik
            failureThreshold: 1
            initialDelaySeconds: 2
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /ping
              port: traefik
            failureThreshold: 3
            initialDelaySeconds: 2
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
spec:
  selector:
    app: traefik
  ports:
    - name: web
      port: {{ .Values.servicePorts.web }}
      targetPort: web
