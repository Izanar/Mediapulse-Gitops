image: traefik:v3.7.14
replicas: 4

# Порты пода (entryPoints): traefik 8080 (api+ping), web 8000, metrics 9100
ports:
  traefik: 8080
  web: 8000
  metrics: 9100

# Домен дашборда через Cloudflare Tunnel — https://traefik.izanar.dev/dashboard/
host: traefik.izanar.dev

# Внешний HTTP origin для Cloudflare Tunnel.
servicePorts:
  web: 80
