# Values для установки официального чарта argo/argo-cd напрямую из внешнего репо
# (helm upgrade --install ... --repo https://argoproj.github.io/argo-helm, см. make argocd-up).
# Без локальной обёртки: версия пинится флагом --version в Makefile.

server:
  # Traefik обрабатывает стандартный Kubernetes Ingress; CRD Traefik устанавливаются позже.
  # Insecure-режим argocd-server включается через configs.params.server.insecure,
  # Traefik завершает TLS на entryPoint websecure, внутри — HTTP.
  ingress:
    enabled: false

configs:
  cm:
    url: https://argocd.local
  params:
    server.insecure: true
  rbac:
    policy: |
      g, admins, role:admin

# Собственные ресурсы поверх чарта
extraObjects:
  - |
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: argocd-server-ingress
      namespace: {{ .Release.Namespace }}
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
    spec:
      rules:
        - host: argocd.local
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: argocd-server
                    port:
                      number: 80
